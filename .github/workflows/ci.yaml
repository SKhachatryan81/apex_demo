name: "ci"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_USER: test_user
      DB_PASS: test_pass
      DB_NAME: test_db
      TEST_DB_NAME: test_db
      DB_PORT: 5432
      SALT: 4
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 14d
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: install dependencies
        run: npm ci
        working-directory: ./backend

      # tests create tables with sequelize.sync(), so this is the only place the real migrations get tested
      - name: run migrations
        run: npm run migrate
        working-directory: ./backend

      - name: run tests
        run: npm test
        working-directory: ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci
        working-directory: ./frontend

      - name: build
        run: npm run build
        working-directory: ./frontend

      - name: test
        run: npm run test:ci
        working-directory: ./frontend

  infra:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0

      - name: terraform fmt and validate
        working-directory: ./terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: helm lint
        run: |
          helm lint k8s/apex-app
          helm lint k8s/apex-monitoring
