apiVersion: v1
kind: Service
metadata:
    name: {{ .Release.Name }}-backend-svc
    namespace: {{ .Release.Namespace }}
    labels:
        workload: backend
spec:
    type: ClusterIP
    ports:
        - name: http
          port: 80
          targetPort: {{ .Values.backend.port }}
          protocol: TCP
        - name: monitoring
          port: {{ .Values.monitoring.port }}
          targetPort: {{ .Values.monitoring.port }}
          protocol: TCP
    selector:
        workload: backend
