apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: {{ .Release.Name }}-backend-servicemonitoring
    namespace: {{ .Release.Namespace }}
    labels:
        release: kube-prometheus-stack
spec:
    selector:
        matchLabels:
            workload: backend
    endpoints:
        - port: monitoring
          path: /metrics
          interval: 30s
