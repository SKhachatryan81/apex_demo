apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
    name: {{ .Release.Name }}-monitoring-ingress
    namespace: {{ .Release.Namespace }}
spec:
    ingressClassName: nginx
    rules:
        - http:
            paths:
                - path: /grafana
                  pathType: Prefix
                  backend:
                    service: 
                        name: kube-prometheus-stack-grafana
                        port:
                            number: 80
